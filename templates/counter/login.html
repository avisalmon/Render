{% extends "counter/base.html" %}
{% block title %}Sign in · counter{% endblock %}
{% block content %}
<h1>Sign in</h1>
<a class="counter-btn counter-btn--primary" href="/accounts/google/login/?process=login&amp;next={{ next|default:'/counter/'|urlencode }}">Continue with Google</a>
<p class="counter-muted">or with email and password</p>
<form method="post" class="counter-card counter-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% if form.non_field_errors %}<p class="counter-error" role="alert">{{ form.non_field_errors.0 }}</p>{% endif %}
  <label>Email or username {{ form.username }}</label>
  <label>Password {{ form.password }}</label>
  <button type="submit" class="counter-btn counter-btn--primary">Sign in</button>
</form>
{% endblock %}
