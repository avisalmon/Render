{% load static %}<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}counter{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'counter/counter.css' %}">
</head>
<body class="counter" data-csrf="{{ csrf_token }}">
<header class="counter-header">
  <a class="counter-wordmark" href="{% url 'counter:dashboard' %}">counter</a>
  <nav class="counter-nav">
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'counter:logout' %}">{% csrf_token %}
        <button type="submit" class="counter-btn counter-btn--quiet">Sign out</button>
      </form>
    {% endif %}
  </nav>
</header>
<main class="counter-main">{% block content %}{% endblock %}</main>
<script src="{% static 'counter/counter.js' %}"></script>
</body>
</html>
