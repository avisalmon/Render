{# One site on the board: a polaroid with a pin (REQ-C.11, C.13, C.14). #}
<article class="cb-card" data-exhibit="{{ card.pk }}">
  <span class="cb-pin" aria-hidden="true"></span>
  <a class="cb-shot" href="{% url 'cohort:exhibit' card.pk %}" aria-label="{{ card.title }}">
    {% if card.shot %}
      <img src="/cohort/files/{{ card.shot.name }}" alt="צילום של האתר {{ card.title }}" loading="lazy" width="1200" height="750">
    {% elif card.shot_status == "waiting" %}
      <span class="cb-shot-empty">מצלמים את האתר...</span>
    {% else %}
      <span class="cb-shot-empty">אין עדיין תמונה</span>
    {% endif %}
  </a>
  <div class="cb-card-text">
    <a class="cb-card-title" href="{% url 'cohort:exhibit' card.pk %}">{{ card.title }}</a>
    <span class="cb-card-by">{{ card.owner.display_name }}</span>
  </div>
  <div class="cb-card-acts">
    <button type="button" class="cb-act cb-like" data-like="{{ card.pk }}" aria-pressed="{% if card.liked %}true{% else %}false{% endif %}" aria-label="לייק">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.7 1.2 5.4 3.1 1.7-1.9 3.2-3.1 5.4-3.1 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span class="cb-count">{{ card.n_likes }}</span>
    </button>
    <button type="button" class="cb-act cb-star" data-star="{{ card.pk }}" aria-pressed="{% if card.starred %}true{% else %}false{% endif %}" aria-label="מועדפים">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>
    </button>
    <a class="cb-act" href="{% url 'cohort:exhibit' card.pk %}#thread" aria-label="{{ card.n_comments }} תגובות">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4.5 3.6V17H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>
      <span class="cb-count">{{ card.n_comments }}</span>
    </a>
    <a class="cb-visit" href="{{ card.url }}" target="_blank" rel="noopener noreferrer">לאתר</a>
  </div>
</article>
