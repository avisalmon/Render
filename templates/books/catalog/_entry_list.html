{% load books_tags %}<ul class="bk-entry-list">
  {% for e in entries %}
  <li class="bk-entry-row">
    <a class="bk-entry-link" href="{% url 'books:catalog_entry' e.pk %}">
      <span class="bk-entry-cover" aria-hidden="true"{% if not e.cover %} style="{% spine_style e %}"{% endif %}>{% if e.cover %}<img src="{{ e.cover.url }}" alt="">{% endif %}</span>
      <span class="bk-entry-text">
        <span class="bk-entry-title">{{ e.title }}</span>
        <span class="bk-muted">{{ e.creator_names }}{% if e.year %} · {{ e.year }}{% endif %}</span>
        {% if not e.is_verified %}<span class="bk-kicker">{% t "catalog.unverified" %}</span>{% endif %}
      </span>
    </a>
  </li>
  {% endfor %}
</ul>
