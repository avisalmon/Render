{% load books_tags %}{% with current=request.resolver_match.url_name %}
<nav class="{% if side %}bk-side{% else %}bk-nav{% endif %}" aria-label="{% t "nav.main" %}">
  <a class="bk-nav-item" href="{% url 'books:home' %}" {% if current == "home" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-6h3v6H18V9.5"/></svg>{% t "nav.home" %}</a>
  <a class="bk-nav-item" href="{% url 'books:catalog' %}" {% if current == "catalog" or current == "catalog_entry" or current == "catalog_new" or current == "catalog_tag" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>{% t "nav.search" %}</a>
  <a class="bk-nav-item" href="{% url 'books:friends' %}" {% if current == "friends" or current == "friend_shelf" or current == "people" or current == "person" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 2 6 5.5"/></svg>{% t "nav.friends" %}</a>
  <a class="bk-nav-item" href="{% url 'books:settings' %}" {% if current == "settings" or current == "my_data" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>{% t "nav.me" %}</a>
  <a class="bk-nav-item bk-nav-item--site" href="/babook/">
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>{% t "nav.site" %}</a>
  <a class="bk-nav-item bk-nav-item--read" href="{% url 'books:read_continue' %}" {% if current == "read" or current == "read_summary" or current == "first_read" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6c3-1.5 6-1.5 9 0v13c-3-1.5-6-1.5-9 0zM21 6c-3-1.5-6-1.5-9 0v13c3-1.5 6-1.5 9 0z"/></svg>{% t "nav.reading" %}</a>
</nav>
{% endwith %}
