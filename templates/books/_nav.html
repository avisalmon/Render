{% load books_tags %}{% with current=request.resolver_match.url_name %}
<nav class="{% if side %}bk-side{% else %}bk-nav{% endif %}" aria-label="{% t "nav.main" %}">
  <a class="bk-nav-item" href="{% url 'books:home' %}" {% if current == "home" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8 1-3.6 14-3.8-1z"/></svg>{% t "nav.collection" %}</a>
  <span class="bk-nav-item" aria-disabled="true" title="{% t "nav.soon" %}">
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>{% t "nav.near" %}</span>
  <span class="bk-nav-item" aria-disabled="true" title="{% t "nav.soon" %}">
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v9M19 10v9M9 10v9M15 10v9M3 21h18"/></svg>{% t "nav.museum" %}</span>
  <span class="bk-nav-item" aria-disabled="true" title="{% t "nav.soon" %}">
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 2 6 5.5"/></svg>{% t "nav.club" %}</span>
  <a class="bk-nav-item" href="{% url 'books:settings' %}" {% if current == "settings" or current == "my_data" %}aria-current="page"{% endif %}>
    <svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>{% t "nav.me" %}</a>
</nav>
{% endwith %}
