{% extends "improv/base.html" %}
{% load static %}
{% block title %}improv - Library{% endblock %}
{% block content %}
<div id="library" class="im-lib"
     data-api-progressions="{{ api.progressions }}"
     data-api-qualities="{{ api.qualities }}"
     data-play-url="{{ play_url }}"
     data-editor-url="{{ editor_url }}">

  <div class="im-play-head">
    <h1 class="im-title">Library</h1>
    <p id="lib-status" class="im-status" role="status" aria-live="polite">Loading the library.</p>
    <a class="im-btn im-btn-link" href="{{ editor_url }}">New progression</a>
  </div>

  <section class="im-panel" aria-label="Filters">
    <div class="im-grid">
      <label class="im-field">Search
        <input id="f-q" class="im-input im-input-wide" type="search" placeholder="title, tag or word" autocomplete="off">
      </label>
      <label class="im-field">Genre
        <select id="f-genre" class="im-select"></select>
      </label>
      <label class="im-field">Tag
        <select id="f-tag" class="im-select"></select>
      </label>
      <label class="im-field">Level
        <select id="f-difficulty" class="im-select"></select>
      </label>
      <label class="im-field">Sort by
        <select id="f-sort" class="im-select">
          <option value="difficulty">Level</option>
          <option value="title">Title</option>
          <option value="genre">Genre</option>
        </select>
      </label>
      <label class="im-field im-check">
        <input id="f-mine" type="checkbox"> My progressions only
      </label>
    </div>
    <p class="im-note">
      <span id="lib-count"></span>
      <button id="f-clear" class="im-btn im-btn-link im-btn-quiet" type="button">Clear filters</button>
    </p>
  </section>

  <section id="lib-list" class="im-cards" aria-label="Progressions"></section>
  <p id="lib-empty" class="im-note" hidden>Nothing matches these filters.</p>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'improv/chart.js' %}"></script>
<script src="{% static 'improv/library.js' %}"></script>
<script src="{% static 'improv/library-page.js' %}"></script>
{% endblock %}
