{% extends "exo/base.html" %}
{% load exo %}
{% block title %}{% t "error.403_title" %} — exo{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block screen %}error-403{% endblock %}
{% block content %}
<div class="exo-wrap-narrow exo-error">
  <div class="exo-error-code">403</div>
  <h1>{% t "error.403_title" %}</h1>
  <p>{% t "error.403_blurb" %}</p>
  <a class="exo-btn" href="{% url 'exo:home' %}">{% t "common.back" %}</a>
</div>
{% endblock %}
