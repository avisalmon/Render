{% extends "crashtech/base.html" %}
{% block title %}Reset your password &middot; CrashTech{% endblock %}
{% block screen %}password-reset{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p class="ct-lede">We will email you a link.</p>
<form method="post">{% csrf_token %}
  <label class="ct-field"><span>Email</span>
    <input class="ct-input" type="email" name="email" autocomplete="email" required autofocus></label>
  <button class="ct-btn ct-btn--primary ct-btn--wide" type="submit">Send the link</button>
</form>
{% endblock %}
