{% if checks is None %}{% elif not checks %}<p class="d3-check d3-ok">Ready to print: it lies flat, nothing floats, no wall is too thin, and it fits a 220 mm bed.</p>{% else %}<ul class="d3-check-list">{% for c in checks %}<li class="d3-check {% if c.level == 'warn' %}d3-warn{% else %}d3-note{% endif %}"><span>{{ c.text }}</span>{% if c.level == 'warn' %} <button type="button" class="d3-btn d3-btn-small d3-btn-quiet d3-fix" data-fix="{{ c.fix }}">Fix it</button>{% endif %}</li>{% endfor %}</ul>{% endif %}
