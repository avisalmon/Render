{% extends "dentist/base.html" %}
{% block title %}Reset the password{% endblock %}
{% block screen %}password-reset{% endblock %}
{% block content %}
<h1>Reset the password</h1>
<p class="dn-lede">Type the email address. If an account exists for it, a link arrives there.</p>
<form method="post" class="dn-card">{% csrf_token %}
  <label class="dn-field"><span>Email</span>
    <input class="dn-input" type="email" name="email" autocomplete="email" required autofocus></label>
  <button class="dn-btn dn-btn--primary dn-btn--wide" type="submit">Send the link</button>
</form>
{% endblock %}
