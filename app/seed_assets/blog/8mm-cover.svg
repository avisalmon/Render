<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="שחזור סרט 8 מ״מ, חזרה לחיים">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d10"/>
      <stop offset="0.55" stop-color="#4a3418"/>
      <stop offset="1" stop-color="#180f08"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b07c3a"/>
      <stop offset="1" stop-color="#e6ac57"/>
    </linearGradient>
    <pattern id="perf" x="0" y="0" width="60" height="110" patternUnits="userSpaceOnUse">
      <rect x="21" y="8"  width="18" height="12" rx="3" fill="#ecdfc3" fill-opacity="0.85"/>
      <rect x="21" y="90" width="18" height="12" rx="3" fill="#ecdfc3" fill-opacity="0.85"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#fade)"/>

  <text x="600" y="164" text-anchor="middle" font-family="'Heebo','Segoe UI',sans-serif"
        font-size="26" letter-spacing="6" fill="#e6c48f" fill-opacity="0.85">AVI SALMON BLOG</text>

  <text x="600" y="300" text-anchor="middle" font-family="'Frank Ruhl Libre',Georgia,serif"
        font-weight="700" font-size="104" fill="#f5efe2">חזרה לחיים</text>

  <text x="600" y="366" text-anchor="middle" font-family="'Heebo','Segoe UI',sans-serif"
        font-size="32" fill="#efe3d0" fill-opacity="0.92">שחזור סרט הבר מצווה שלי מפילם 8 מ״מ ישן</text>

  <rect x="500" y="404" width="200" height="3" rx="1.5" fill="#e6c48f" fill-opacity="0.6"/>

  <!-- Film strip motif: faded on the left, restored and warm on the right -->
  <g>
    <rect x="120" y="456" width="960" height="110" rx="10" fill="#130c07" stroke="#7a5522" stroke-width="2"/>
    <rect x="120" y="456" width="960" height="110" fill="url(#perf)"/>
    <!-- faded frames -->
    <rect x="150" y="488" width="140" height="46" rx="3" fill="#6f665a"/>
    <rect x="300" y="488" width="140" height="46" rx="3" fill="#736a5d"/>
    <rect x="450" y="488" width="140" height="46" rx="3" fill="#77705f"/>
    <!-- a scratch running down a faded frame -->
    <line x1="360" y1="486" x2="360" y2="536" stroke="#cbb89a" stroke-opacity="0.6" stroke-width="2"/>
    <!-- restored frames -->
    <rect x="600" y="488" width="140" height="46" rx="3" fill="#b07c3a"/>
    <rect x="750" y="488" width="140" height="46" rx="3" fill="url(#warm)"/>
    <rect x="900" y="488" width="140" height="46" rx="3" fill="#e6ac57"/>
  </g>
</svg>
