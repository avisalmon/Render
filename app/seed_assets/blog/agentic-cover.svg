<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="חינוך מדעי המחשב בעידן הבינה המלאכותית">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a33"/>
      <stop offset="0.55" stop-color="#333b73"/>
      <stop offset="1" stop-color="#10132a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#fade)"/>

  <!-- Faint agent-orchestration graph: one lead node branching to sub-agents -->
  <g stroke="#c3c9f2" stroke-opacity="0.28" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M150 300 L 300 190"/>
    <path d="M150 300 L 300 300"/>
    <path d="M150 300 L 300 410"/>
    <path d="M300 190 L 430 150"/>
    <path d="M300 410 L 430 470"/>
  </g>
  <g fill="#c3c9f2" fill-opacity="0.5">
    <circle cx="150" cy="300" r="12"/>
    <circle cx="300" cy="190" r="8"/>
    <circle cx="300" cy="300" r="8"/>
    <circle cx="300" cy="410" r="8"/>
    <circle cx="430" cy="150" r="6"/>
    <circle cx="430" cy="470" r="6"/>
  </g>

  <text x="600" y="208" text-anchor="middle" font-family="'Heebo','Segoe UI',sans-serif"
        font-size="26" letter-spacing="6" fill="#c3c9f2" fill-opacity="0.85">AVI SALMON BLOG</text>

  <text x="600" y="322" text-anchor="middle" font-family="'Frank Ruhl Libre',Georgia,serif"
        font-weight="700" font-size="86" fill="#f3efe6">כשהקוד נעשה זול</text>

  <text x="600" y="392" text-anchor="middle" font-family="'Heebo','Segoe UI',sans-serif"
        font-size="29" fill="#e2e5f4" fill-opacity="0.92">חמישה עקרונות לחינוך מדעי המחשב בעידן הבינה המלאכותית</text>

  <rect x="500" y="430" width="200" height="3" rx="1.5" fill="#c3c9f2" fill-opacity="0.6"/>
</svg>
