<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Rubik', 'Segoe UI', system-ui, sans-serif;
           background: #FAF9F7; color: #1A1A18; -webkit-font-smoothing: antialiased; }
    a { color: #1A1A18; text-decoration: underline; }
    a:hover { color: #6B6862; }
    .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF9F7; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 12px 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E8E9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h3l2-6 3 12 3-9 2 3h7"/>
      </svg>
      <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.2px;">SensorLab</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 11px; border: 1px solid #EAE7E1; background: #FFFFFF; border-radius: 22px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#3D3B37" stroke="none">
          <path d="M13 2L5 14h5l-1 8 8-12h-5l1-8z"/>
        </svg>
        <span class="tnum" style="font-size: 14px; font-weight: 500;">5</span>
      </div>
      <div style="display: flex; align-items: center; height: 44px; border: 1px solid #EAE7E1; background: #FFFFFF; border-radius: 22px; overflow: hidden;">
        <span style="padding: 0 11px; height: 100%; display: flex; align-items: center; font-size: 13px; font-weight: 600; background: #1A1A18; color: #FFFFFF;">EN</span>
        <span style="padding: 0 11px; height: 100%; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: #6B6862;">עב</span>
      </div>
    </div>
  </div>

  <!-- continue card -->
  <div style="margin: 4px 16px 0 16px; padding: 16px; background: #FFFFFF; border: 1px solid #EAE7E1; border-radius: 16px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: #6B6862;">Continue</div>
    <div style="font-size: 19px; font-weight: 600; margin-top: 6px; letter-spacing: -0.2px;">Free Fall — Measuring g</div>

    <div style="display: flex; gap: 5px; margin-top: 14px;">
      <div style="flex: 1; height: 5px; border-radius: 3px; background: #1A1A18;"></div>
      <div style="flex: 1; height: 5px; border-radius: 3px; background: #1A1A18;"></div>
      <div style="flex: 1; height: 5px; border-radius: 3px; background: #1A1A18;"></div>
      <div style="flex: 1; height: 5px; border-radius: 3px; background: #E2DED6;"></div>
      <div style="flex: 1; height: 5px; border-radius: 3px; background: #E2DED6;"></div>
    </div>
    <div style="font-size: 13px; color: #6B6862; margin-top: 9px;">Step 3 of 5 — Predict</div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; margin-top: 16px; background: #1A1A18; color: #FFFFFF; border-radius: 12px; font-size: 15px; font-weight: 500;">
      Resume
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </div>
  </div>

  <!-- tracks -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 26px 16px 10px 16px;">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: #6B6862;">Tracks</span>
    <span class="tnum" style="font-size: 12px; color: #6B6862;">4 topics</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px;">

    <div style="display: flex; align-items: center; gap: 13px; padding: 14px; background: #FFFFFF; border: 1px solid #EAE7E1; border-radius: 14px;">
      <div style="width: 42px; height: 42px; border-radius: 11px; background: #F2EFE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v13"/><path d="M7.5 11.5L12 16l4.5-4.5"/><path d="M4 20h16"/>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 500;">Free Fall</div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 7px;">
          <div style="flex: 1; height: 4px; border-radius: 2px; background: #EAE7E1; overflow: hidden;">
            <div style="width: 75%; height: 100%; background: #1A1A18;"></div>
          </div>
          <span class="tnum" style="font-size: 12px; color: #6B6862;">3 / 4</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 14px; background: #FFFFFF; border: 1px solid #EAE7E1; border-radius: 14px;">
      <div style="width: 42px; height: 42px; border-radius: 11px; background: #F2EFE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9E9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 500; color: #9E9A92;">Pendulums</div>
        <div style="font-size: 12px; color: #9E9A92; margin-top: 5px;">Finish Free Fall to unlock</div>
      </div>
      <span class="tnum" style="font-size: 12px; color: #9E9A92;">0 / 3</span>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 14px; background: #FFFFFF; border: 1px solid #EAE7E1; border-radius: 14px;">
      <div style="width: 42px; height: 42px; border-radius: 11px; background: #F2EFE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h2.5l2-5 3 10 3-13 3 16 2.5-8H21"/>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 500;">Sound &amp; Waves</div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 7px;">
          <div style="flex: 1; height: 4px; border-radius: 2px; background: #EAE7E1; overflow: hidden;">
            <div style="width: 20%; height: 100%; background: #1A1A18;"></div>
          </div>
          <span class="tnum" style="font-size: 12px; color: #6B6862;">1 / 5</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 14px; background: #FFFFFF; border: 1px solid #EAE7E1; border-radius: 14px;">
      <div style="width: 42px; height: 42px; border-radius: 11px; background: #F2EFE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 500;">Rotation</div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 7px;">
          <div style="flex: 1; height: 4px; border-radius: 2px; background: #EAE7E1; overflow: hidden;">
            <div style="width: 0%; height: 100%; background: #1A1A18;"></div>
          </div>
          <span class="tnum" style="font-size: 12px; color: #6B6862;">0 / 4</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </div>

  </div>

  <div style="flex: 1;"></div>

  <!-- bottom nav -->
  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #EAE7E1;">
    <div style="flex: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1A1A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span style="font-size: 11px; font-weight: 500; color: #1A1A18;">Tracks</span>
    </div>
    <div style="flex: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9E9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5"/><path d="M18.5 19c0-2-.5-3.9-1.5-5.4"/>
      </svg>
      <span style="font-size: 11px; color: #9E9A92;">Group</span>
    </div>
    <div style="flex: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9E9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
      </svg>
      <span style="font-size: 11px; color: #9E9A92;">Profile</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
