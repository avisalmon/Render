    "spr18: SPR-1.8 AI Chat sprint tests",
    "spr19: SPR-1.9 Email Service sprint tests",
    "spr110: SPR-1.10 Database Backups sprint tests",
    "spr201: SPR-2.0.1 Design System Foundation sprint tests",
    "spr211: SPR-2.1.1 Corporate Page Conversion MVP sprint tests",
    "spr213: SPR-2.1.3 Newsletter Capture MVP sprint tests",
    "spr214: SPR-2.1.4 Corporate Page Polish & Compliance sprint tests",
    "sprm1: SPR-M.1 מט״צים front door sprint tests",
    "sprm2: SPR-M.2 מט״צים identity and first-contact sprint tests",
    "sprm3: SPR-M.3 מט״צים entrance test sprint tests",
    "sprm4: SPR-M.4 מט״צים public sections sprint tests",
    "sprm5: SPR-M.5 מט״צים small corrections sprint tests",
    "sprm6: SPR-M.6 מט״צים roles and access sprint tests",
    "sprm7: SPR-M.7 מט״צים joining and leaders sprint tests",
    "sprm8: SPR-M.8 מט״צים the leader's students, and what makes a mataz",
    "sprm9: SPR-M.9 מט״צים privacy: the holes, and the terms",
    "sprm10: SPR-M.10 מט״צים consent, rights, and an end date",
    "sprm11: SPR-M.11 מט״צים retention with a person in front of it",
    "sprm12: SPR-M.12 מט״צים say what we mean (the program-manager rename)",
    "sprm13: SPR-M.13 מט״צים tenancy, the worlds do not touch",
    "sprm14: SPR-M.14 מט״צים how a leader gets made",
    "sprm15: SPR-M.15 מט״צים her leaders, and one of them in full",
    "sprm16: SPR-M.16 מט״צים המסלול שלי, the member's own screen",
