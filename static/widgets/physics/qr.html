<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סריקה לפתיחה בטלפון</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif;
       color:#1f2937; background:#f9fafb; padding:20px; line-height:1.5;
       min-height:100vh; display:flex; align-items:center; justify-content:center;}
  .card{background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:24px;
        max-width:420px; width:100%; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  h1{font-size:1.15rem; margin:0 0 6px;}
  p{color:#6b7280; font-size:.9rem; margin:6px 0;}
  #qr{display:inline-block; margin:14px auto; padding:12px; background:#fff; border-radius:12px;}
  #qr img, #qr canvas{display:block;}
  .url{direction:ltr; font-family:ui-monospace,Consolas,monospace; font-size:.72rem; color:#9ca3af;
       word-break:break-all; margin-top:10px; background:#f3f4f6; border-radius:8px; padding:8px;}
  .open{display:inline-block; margin-top:12px; background:#2563eb; color:#fff; text-decoration:none;
        border-radius:10px; padding:10px 18px; font-weight:600; font-size:.95rem;}
  .err{color:#dc2626;}
</style>
</head>
<body>
  <div class="card">
    <h1>סרקו עם המצלמה של הטלפון</h1>
    <p>כוונו את מצלמת הטלפון אל הריבוע, ופתחו את הקישור שיופיע. המעבדה תיפתח בטלפון, מוכנה למדידה.</p>
    <div id="qr"></div>
    <a class="open" id="openLink" href="#">או פתחו כאן ישירות</a>
    <div class="url" id="urlText"></div>
  </div>
  <script src="/static/js/qrcode.min.js"></script>
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      var target = params.get("u") || "";
      var box = document.getElementById("qr");
      var urlText = document.getElementById("urlText");
      var openLink = document.getElementById("openLink");
      if(!target){
        box.innerHTML = '<p class="err">חסר פרמטר u עם הכתובת לסריקה.</p>';
        return;
      }
      urlText.textContent = target;
      openLink.href = target;
      // Size the QR to the card width (min 220, max 300).
      var size = Math.max(220, Math.min(300, box.clientWidth || 260));
      new QRCode(box, { text: target, width: size, height: size,
        colorDark: "#111827", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M });
    })();
  </script>
</body>
</html>
