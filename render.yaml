services:
  - type: web
    name: mysite
    runtime: python
    plan: starter
    branch: main
    buildCommand: ./build.sh
    # load_course_from_manifest is scoped to explicit slugs on purpose:
    # a bare (all-manifests) run would also re-seed micropython-thonny and overwrite
    # any edits made to that live course in prod. Add slugs here only for courses
    # whose manifest is the source of truth. engineer-x10 (מהנדס x10) is the Level 2
    # course; it supersedes the DB-only co-coding-copilot, which hide_courses retires.
    startCommand: python manage.py migrate && (python manage.py ensure_schema || true) && (python manage.py createsuperuser --noinput || true) && (python manage.py seed_blog || true) && (python manage.py seed_matazim || true) && (python manage.py load_course_from_manifest transformers-from-scratch engineer-x10 pocket-physics || true) && (python manage.py hide_courses co-coding-copilot || true) && gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: PERSISTENT_ROOT
        value: /var/data
      - key: ALLOWED_HOSTS
        value: mysite-0tu0.onrender.com,babook.co.il,www.babook.co.il
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mysite-0tu0.onrender.com,https://babook.co.il,https://www.babook.co.il
      - key: SECRET_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: BACKUP_TRIGGER_TOKEN
        sync: false
      # Chapter 11 - Home Security Relay. Secrets, never in git (REQ-11.8.4).
      # Unset means the API answers 503 and /home 404s, which is the right
      # closed default.
      - key: SECURITY_RELAY_TOKEN
        sync: false
      - key: SECURITY_OWNER_EMAIL
        sync: false
      # Optional comma-separated delegated viewers. Empty = owner only.
      - key: SECURITY_VIEWER_EMAILS
        sync: false
    disk:
      name: mysite-disk
      mountPath: /var/data
      sizeGB: 1
