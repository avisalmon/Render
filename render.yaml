services:
  - type: web
    name: mysite
    runtime: python
    plan: starter
    branch: main
    buildCommand: ./build.sh
    # load_course_from_manifest is scoped to explicit slugs on purpose:
    # a bare (all-manifests) run would also re-seed micropython-thonny and overwrite
    # any edits made to that live course in prod. Add slugs here only for courses
    # whose manifest is the source of truth. engineer-x10 (מהנדס x10) is the Level 2
    # course; it supersedes the DB-only co-coding-copilot, which hide_courses retires.
    startCommand: python manage.py migrate && (python manage.py ensure_schema || true) && (python manage.py createsuperuser --noinput || true) && (python manage.py seed_blog || true) && (python manage.py seed_matazim || true) && (python manage.py sync_matazim_targets || true) && (python manage.py matazim_admins --from-env || true) && (python manage.py seed_matazim_demo --if-enabled || true) && (python manage.py load_course_from_manifest transformers-from-scratch engineer-x10 pocket-physics || true) && (python manage.py hide_courses co-coding-copilot || true) && (python manage.py seed_ustrip || true) && (python manage.py enrich_ustrip_items || true) && (python manage.py seed_memz || true) && (python manage.py seed_sensorlab || true) && (python manage.py seed_exo || true) && (python manage.py retire_placeholder_images || true) && gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: PERSISTENT_ROOT
        value: /var/data
      - key: ALLOWED_HOSTS
        value: mysite-0tu0.onrender.com,babook.co.il,www.babook.co.il
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mysite-0tu0.onrender.com,https://babook.co.il,https://www.babook.co.il
      - key: SECRET_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: BACKUP_TRIGGER_TOKEN
        sync: false
      # Chapter 11 - Home Security Relay. Secrets, never in git (REQ-11.8.4).
      # Unset means the API answers 503 and /home 404s, which is the right
      # closed default.
      - key: SECURITY_RELAY_TOKEN
        sync: false
      - key: SECURITY_OWNER_EMAIL
        sync: false
      # Web Push (REQ-11.6.9). Generate with scripts/gen_vapid.py. The PRIVATE
      # key is a credential - anything holding it can push to every subscribed
      # phone - so both are sync: false and neither is ever in git. Leaving them
      # empty is the closed default: /home simply does not offer the button.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Optional comma-separated delegated viewers. Empty = owner only.
      - key: SECURITY_VIEWER_EMAILS
        sync: false
      # Shared Drive storage for every app on this project (app/drive.py),
      # added for ustrip's trip photos and meant to outlive it — matazim or
      # memz can use the same four credentials with their own subfolder
      # name later. This is its own dedicated Google Cloud project and OAuth
      # client, deliberately NOT the home security app's Drive grant: that
      # one runs on a separate machine on a separate deploy schedule, and
      # reusing it would have coupled the two. Set up with
      # `manage.py drive_setup` (one-time, opens a browser for consent).
      # Unset means uploads are refused with a clear message, never a
      # silent fallback to local disk.
      - key: DRIVE_CLIENT_ID
        sync: false
      - key: DRIVE_CLIENT_SECRET
        sync: false
      - key: DRIVE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
    disk:
      name: mysite-disk
      mountPath: /var/data
      sizeGB: 1
